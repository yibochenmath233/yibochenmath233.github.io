{% include base_path %}

<meta charset="utf-8">
<meta name="google-site-verification" content="Y5sn-SXJjVVxWW8QBCOpqJrNVHaP91kEkypiVrz5gCQ" />

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<style>
  /* 1. 彻底隐藏页面底部的页脚容器和分割线 */
  .page__footer { display: none !important; }

  /* 2. 正文超链接颜色：莫兰迪鼠尾草绿 */
  .page__content a,
  .archive a {
    color: #40916c !important;
    text-decoration: none !important;
  }

  .page__content a:hover,
  .archive a:hover {
    color: #2d6a4f !important;
    text-decoration: underline !important;
  }

  /* 3. 黑暗模式强制改为纯黑（OLED 全黑），文字改为纯白 */
  html[data-theme="dark"],
  html[data-theme="dark"] body,
  html[data-theme="dark"] .initial-content,
  html[data-theme="dark"] .masthead,
  html[data-theme="dark"] .greedy-nav,
  html[data-theme="dark"] .sidebar {
    background-color: #000000 !important;
    color: #ffffff !important;
  }

  /* 黑暗模式下顶部导航栏底部分割线调暗，避免突兀 */
  html[data-theme="dark"] .masthead {
    border-bottom: 1px solid #222222 !important;
  }

  /* 4. 手机端自适应修复（屏幕宽度小于 768px 时自动生效） */
  @media screen and (max-width: 768px) {
    /* 取消右浮动，不改颜色（跟随正文的黑/白），改用斜体和小字号区分层次 */
    span[style*="float: right"],
    span[style*="float:right"] {
      float: none !important;
      display: block !important;
      color: inherit !important; /* 自动继承正文颜色，黑暗模式下是纯白，白天是深黑 */
      font-style: italic !important; /* 用斜体替代灰色来区分层次 */
      font-size: 0.9em !important;
      margin-top: 2px !important;
      margin-bottom: 4px !important;
    }

    /* 优化手机端列表项间距 */
    .page__content li,
    .archive li {
      margin-bottom: 12px !important;
      line-height: 1.5 !important;
    }
  }
</style>
