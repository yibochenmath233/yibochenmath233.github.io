{% include base_path %}

<meta charset="utf-8">
<meta name="google-site-verification" content="Y5sn-SXJjVVxWW8QBCOpqJrNVHaP91kEkypiVrz5gCQ" />

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<style>
  /* 1. 彻底隐藏页面底部的页脚容器和分割线 */
  .page__footer { display: none !important; }

  /* 2. 正文超链接颜色：莫兰迪鼠尾草绿 */
  .page__content a,
  .archive a {
    color: #40916c !important;
    text-decoration: none !important;
  }

  .page__content a:hover,
  .archive a:hover {
    color: #2d6a4f !important;
    text-decoration: underline !important;
  }

  /* 3. 手机端自适应修复（屏幕宽度小于 768px 时自动生效） */
  @media screen and (max-width: 768px) {
    /* 取消所有 float: right，让时间和地点自动换行左对齐，不再和标题挤在一起 */
    span[style*="float: right"],
    span[style*="float:right"] {
      float: none !important;
      display: block !important;
      color: #777777 !important; /* 手机上变成柔和的灰色小字，区分层次 */
      font-size: 0.88em !important;
      margin-top: 2px !important;
      margin-bottom: 4px !important;
    }

    /* 优化手机端列表项之间的间距，防止上下条目粘连 */
    .page__content li,
    .archive li {
      margin-bottom: 10px !important;
      line-height: 1.5 !important;
    }
  }
</style>
